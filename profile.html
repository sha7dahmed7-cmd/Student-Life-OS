<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile | OS</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <!-- Header -->
    <header>

        <a href="index.html" class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
           OS
        </a>

        <nav>
           <a href="profile.html" class="active"> My Profile</a>
        </nav>

    </header>


    <!-- Profile -->
    <main class="profile-section">

        <div class="profile-container">

            <!-- Profile Header -->
            <div class="profile-header">

                <div class="profile-icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <span>STUDENT PROFILE</span>

                    <h1 id="studentName">
                        Student Profile
                    </h1>

                    <p>
                        Your learning information and academic details.
                    </p>
                </div>

            </div>


            <!-- Student Information -->
            <div class="profile-info">

                <!-- Name -->
                <div class="info-card">
                    <div class="info-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div>
                        <span>Full Name</span>
                        <h3 id="name">—</h3>
                    </div>
                </div>


                <!-- Email -->
                <div class="info-card">
                    <div class="info-icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div>
                        <span>Email</span>
                        <h3 id="email">—</h3>
                    </div>
                </div>


                <!-- Academic Year -->
                <div class="info-card">
                    <div class="info-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>

                    <div>
                        <span>Academic Year</span>
                        <h3 id="year">—</h3>
                    </div>
                </div>


                <!-- Subject -->
                <div class="info-card">
                    <div class="info-icon">
                        <i class="fa-solid fa-book"></i>
                    </div>

                    <div>
                        <span>Subject</span>
                        <h3 id="subject">—</h3>
                    </div>
                </div>


                <!-- Track -->
                <div class="info-card full-card">
                    <div class="info-icon">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>

                    <div>
                        <span>Learning Track</span>
                        <h3 id="track">—</h3>
                    </div>
                </div>

            </div>

        </div>

    </main>


    <script src="profile.js"></script>

</body>

</html>
