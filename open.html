
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Life OS</title>

    <link rel="stylesheet" href="student.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="open-page">

    <button id="theme-toggle" class="theme-toggle"
        type="button" aria-label="تفعيل الوضع الليلي">
        <i class="fa-solid fa-moon"></i>
    </button>

    <section class="login-page">

        <div class="login-box">

            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h1>Student Life OS</h1>

            <p>نظم حياتك الجامعية في مكان واحد 🎓</p>

            <div class="choice-buttons">

                <a href="signup.html" class="main-btn choice-btn">
                    <i class="fa-solid fa-user-plus"></i>
                    إنشاء حساب
                </a>

                <a href="student.html" class="main-btn choice-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    تسجيل الدخول
                </a>

            </div>

        </div>

    </section>

    <script>
        const toggle = document.getElementById("theme-toggle");
        const icon = toggle.querySelector("i");

        function applyTheme(theme) {
            document.body.classList.toggle("dark", theme === "dark");

            icon.className = theme === "dark"
                ? "fa-solid fa-sun"
                : "fa-solid fa-moon";

            toggle.setAttribute(
                "aria-label",
                theme === "dark"
                    ? "تفعيل الوضع الفاتح"
                    : "تفعيل الوضع الليلي"
            );
        }

        applyTheme(localStorage.getItem("theme") || "light");

        toggle.addEventListener("click", () => {
            const isDark = document.body.classList.contains("dark");
            const newTheme = isDark ? "light" : "dark";

            localStorage.setItem("theme", newTheme);
            applyTheme(newTheme);
        });
    </script>

</body>
</html>
